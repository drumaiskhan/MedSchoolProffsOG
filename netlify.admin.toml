# ============================================================================
# MedSchoolProffs - Admin Netlify Configuration
# ============================================================================
#
# IMPORTANT: this file previously had two bugs that broke every /api/* call
# from the admin app (flashcards generation, MCQ import, settings, etc.):
#
#   1. `publish` was "frontend-admin/dist/public" but the actual build
#      output (see artifacts/frontend-admin/vite.config.ts's outDir, and
#      render.yaml's staticPublishPath for the same site) is
#      "artifacts/frontend-admin/dist/public" — missing the artifacts/
#      prefix.
#   2. There was no [[redirects]] entry forwarding /api/* to the backend.
#      Without it, VITE_API_BASE_URL must be set at build time (see
#      DEPLOY-SPLIT.md) — and if it's blank, every fetch to /api/... resolves
#      against this same Netlify site, which has no route for it, so the
#      SPA catch-all below returns index.html (raw HTML) instead of JSON.
#      That's exactly the "AI provider returned an invalid response:
#      <!DOCTYPE html>..." / non-JSON error seen in the admin UI.
#
# Update the redirect target below to your actual Railway (or Render) backend
# URL if it differs, then EITHER rely on this redirect OR set
# VITE_API_BASE_URL on this site's build (not both needed — the redirect
# alone is enough and is simpler to keep in sync).
#
# ============================================================================

[build]
  base = "/"
  command = "pnpm install --no-frozen-lockfile && pnpm run build:admin"
  publish = "artifacts/frontend-admin/dist/public"

[build.environment]
  NODE_VERSION = "22"
  PNPM_FLAGS = "--no-frozen-lockfile"

# ============================================================================
# API Proxy — MUST come before the SPA catch-all below.
# ============================================================================

[[redirects]]
  from = "/api/*"
  to = "https://medschoolproffsog-production-d573.up.railway.app/api/:splat"
  status = 200
  force = true

# ============================================================================
# SPA Fallback
# ============================================================================

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
