openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: MedschoolProffs learning platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: student
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Student created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /student/dashboard:
    get:
      operationId: getStudentDashboard
      tags: [student]
      summary: Student dashboard overview
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDashboard"
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Admin dashboard overview
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
  /membership-plans:
    get:
      operationId: listMembershipPlans
      tags: [student, admin]
      summary: List active membership plans
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MembershipPlan"
    post:
      operationId: createMembershipPlan
      tags: [admin]
      summary: Create membership plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipPlanInput"
      responses:
        "201":
          description: Plan created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipPlan"
  /membership-plans/{id}:
    patch:
      operationId: updateMembershipPlan
      tags: [admin]
      summary: Update membership plan
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipPlanUpdate"
      responses:
        "200":
          description: Plan updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipPlan"
  /payments:
    get:
      operationId: listPayments
      tags: [admin]
      summary: List payment submissions
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"
    post:
      operationId: submitPayment
      tags: [student]
      summary: Submit payment proof
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Payment submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
  /payments/{id}/approve:
    post:
      operationId: approvePayment
      tags: [admin]
      summary: Approve payment and activate membership
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Payment approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
  /payments/{id}/reject:
    post:
      operationId: rejectPayment
      tags: [admin]
      summary: Reject payment proof
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectPaymentInput"
      responses:
        "200":
          description: Payment rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
  /modules:
    get:
      operationId: listModules
      tags: [student, admin]
      summary: List learning modules
      parameters:
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Modules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Module"
    post:
      operationId: createModule
      tags: [admin]
      summary: Create module
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModuleInput"
      responses:
        "201":
          description: Module created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Module"
  /subjects:
    get:
      operationId: listSubjects
      tags: [student, admin]
      parameters:
        - name: moduleId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Subjects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subject"
  /topics:
    get:
      operationId: listTopics
      tags: [student, admin]
      parameters:
        - name: subjectId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Topics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Topic"
  /mcqs:
    get:
      operationId: listMcqs
      tags: [student, admin]
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: moduleId
          in: query
          schema:
            type: integer
        - name: subjectId
          in: query
          schema:
            type: integer
        - name: topicId
          in: query
          schema:
            type: integer
        - name: difficulty
          in: query
          schema:
            type: string
      responses:
        "200":
          description: MCQs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Mcq"
    post:
      operationId: createMcq
      tags: [admin]
      summary: Create MCQ draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McqInput"
      responses:
        "201":
          description: MCQ created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mcq"
  /flashcards:
    get:
      operationId: listFlashcards
      tags: [student, admin]
      parameters:
        - name: moduleId
          in: query
          schema:
            type: integer
        - name: subjectId
          in: query
          schema:
            type: integer
        - name: topicId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Flashcards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Flashcard"
  /resources:
    get:
      operationId: listResources
      tags: [student, admin]
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: kind
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"
  /students:
    get:
      operationId: listStudents
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"
  /notifications:
    get:
      operationId: listNotifications
      tags: [student, admin]
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    Search:
      name: search
      in: query
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    User:
      type: object
      required: [id, name, email, role, status]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string }
        status: { type: string }
        institution: { type: ["string", "null"] }
        program: { type: ["string", "null"] }
    AuthSession:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: "#/components/schemas/User" }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    RegisterInput:
      type: object
      required: [name, email, password, institution, program, academicYear, batch, rollNumber]
      properties:
        name: { type: string, minLength: 2 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        institution: { type: string }
        program: { type: string }
        academicYear: { type: string }
        batch: { type: string }
        rollNumber: { type: string }
        phone: { type: ["string", "null"] }
    MembershipPlan:
      type: object
      required: [id, name, description, price, currency, duration, durationUnit, active, displayOrder]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        price: { type: number }
        currency: { type: string }
        duration: { type: integer }
        durationUnit: { type: string }
        active: { type: boolean }
        displayOrder: { type: integer }
    MembershipPlanInput:
      type: object
      required: [name, description, price, currency, duration, durationUnit]
      properties:
        name: { type: string }
        description: { type: string }
        price: { type: number, minimum: 0 }
        currency: { type: string }
        duration: { type: integer, minimum: 1 }
        durationUnit: { type: string }
        active: { type: boolean }
        displayOrder: { type: integer }
    MembershipPlanUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        price: { type: number, minimum: 0 }
        currency: { type: string }
        duration: { type: integer, minimum: 1 }
        durationUnit: { type: string }
        active: { type: boolean }
        displayOrder: { type: integer }
    Payment:
      type: object
      required: [id, studentName, institution, program, planName, amount, currency, method, reference, paymentDate, status, submittedAt]
      properties:
        id: { type: integer }
        studentName: { type: string }
        institution: { type: string }
        program: { type: string }
        academicYear: { type: string }
        batch: { type: string }
        rollNumber: { type: string }
        planName: { type: string }
        amount: { type: number }
        currency: { type: string }
        method: { type: string }
        reference: { type: string }
        paymentDate: { type: string }
        proofPath: { type: ["string", "null"] }
        status: { type: string }
        submittedAt: { type: string }
    PaymentInput:
      type: object
      required: [planId, method, reference, paymentDate]
      properties:
        planId: { type: integer }
        method: { type: string }
        reference: { type: string }
        paymentDate: { type: string }
        proofPath: { type: ["string", "null"] }
    RejectPaymentInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 2 }
    Module:
      type: object
      required: [id, name, subtitle, subjectCount, topicCount, progress, active]
      properties:
        id: { type: integer }
        name: { type: string }
        subtitle: { type: string }
        subjectCount: { type: integer }
        topicCount: { type: integer }
        progress: { type: number }
        active: { type: boolean }
    ModuleInput:
      type: object
      required: [name, subtitle]
      properties:
        name: { type: string }
        subtitle: { type: string }
        active: { type: boolean }
    Subject:
      type: object
      required: [id, moduleId, name, topicCount]
      properties:
        id: { type: integer }
        moduleId: { type: integer }
        name: { type: string }
        topicCount: { type: integer }
    Topic:
      type: object
      required: [id, subjectId, name, questionCount, completed]
      properties:
        id: { type: integer }
        subjectId: { type: integer }
        name: { type: string }
        questionCount: { type: integer }
        completed: { type: boolean }
    Mcq:
      type: object
      required: [id, question, options, difficulty, status, module, subject, topic]
      properties:
        id: { type: integer }
        question: { type: string }
        options:
          type: array
          items: { type: string }
        correctAnswer: { type: ["string", "null"] }
        explanation: { type: ["string", "null"] }
        reference: { type: ["string", "null"] }
        difficulty: { type: string }
        status: { type: string }
        module: { type: string }
        subject: { type: string }
        topic: { type: string }
    McqInput:
      type: object
      required: [question, options, difficulty, moduleId, subjectId, topicId]
      properties:
        question: { type: string }
        options:
          type: array
          items: { type: string }
        correctAnswer: { type: string }
        explanation: { type: string }
        reference: { type: string }
        difficulty: { type: string }
        moduleId: { type: integer }
        subjectId: { type: integer }
        topicId: { type: integer }
    Flashcard:
      type: object
      required: [id, front, back, module, topic, learned]
      properties:
        id: { type: integer }
        front: { type: string }
        back: { type: string }
        module: { type: string }
        topic: { type: string }
        learned: { type: boolean }
    Resource:
      type: object
      required: [id, title, description, kind, module, size, updatedAt]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        kind: { type: string }
        module: { type: string }
        size: { type: string }
        updatedAt: { type: string }
        protected: { type: boolean }
    Student:
      type: object
      required: [id, name, email, institution, program, status, joinedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        institution: { type: string }
        program: { type: string }
        status: { type: string }
        joinedAt: { type: string }
        progress: { type: number }
    Notification:
      type: object
      required: [id, title, body, type, read, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        body: { type: string }
        type: { type: string }
        read: { type: boolean }
        createdAt: { type: string }
    StudentDashboard:
      type: object
      required: [user, membershipStatus, progress, weeklyGoal, streak, modules, recentActivity, notifications]
      properties:
        user: { $ref: "#/components/schemas/User" }
        membershipStatus: { type: string }
        membershipExpiry: { type: ["string", "null"] }
        progress: { type: number }
        weeklyGoal: { type: number }
        streak: { type: integer }
        modules:
          type: array
          items: { $ref: "#/components/schemas/Module" }
        recentActivity:
          type: array
          items: { type: string }
        notifications:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
    AdminDashboard:
      type: object
      required: [totalStudents, activeMembers, pendingPayments, monthlyRevenue, recentPayments, studentsByStatus]
      properties:
        totalStudents: { type: integer }
        activeMembers: { type: integer }
        pendingPayments: { type: integer }
        monthlyRevenue: { type: number }
        recentPayments:
          type: array
          items: { $ref: "#/components/schemas/Payment" }
        studentsByStatus:
          type: object
          additionalProperties: { type: integer }