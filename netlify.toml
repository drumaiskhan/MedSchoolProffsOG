[build]
  base = "/"
  command = "pnpm --filter @workspace/frontend-admin run build && rm -rf dist && mkdir -p dist && cp -R frontend-admin/dist/public/. dist/"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_FLAGS = "--no-frozen-lockfile"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
