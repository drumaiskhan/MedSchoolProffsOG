    <style>
      /* Same static branded loading screen as the student app's index.html
         — shown before JS has even loaded, so no blank white flash. */
      #root { background: #0e2a38; }
      .boot-loader { display: flex; min-height: 100dvh; align-items: center; justify-content: center; background: #0e2a38; }
      .boot-loader__stack { display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .boot-loader__wave path { fill: none; stroke: #2dd9c4; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 190; stroke-dashoffset: 190; animation: boot-wave-draw 1.7s ease-in-out infinite; }
      .boot-loader__brand { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.01em; color: #eaf6f4; animation: boot-fade 1.7s ease-in-out infinite; }
      @keyframes boot-wave-draw { 0% { stroke-dashoffset: 190; opacity: .55; } 55% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: -190; opacity: .55; } }
      @keyframes boot-fade { 0%, 100% { opacity: .6; } 50% { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-loader"><div class="boot-loader__stack">
      <svg class="boot-loader__wave" width="64" height="40" viewBox="0 0 64 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M2 20 H14 L19 6 L27 34 L33 12 L38 20 H62" /></svg>
      <div class="boot-loader__brand">MedschoolProffs</div>
    </div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
